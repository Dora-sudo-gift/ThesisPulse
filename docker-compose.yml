version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thesis_pulse_db
    environment:
      POSTGRES_DB: thesis_pulse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: thesis_pulse_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: thesis_pulse_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=thesis_pulse_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata: